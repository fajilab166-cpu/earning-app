<!doctype html>
<html lang="bn"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#087f5b"><title>Earning App</title><link rel="stylesheet" href="/style.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://sad.adsgram.ai/js/sad.min.js"></script>
</head><body><main class="app">
<header><div><small>স্বাগতম</small><h1 id="username">Earning App</h1></div><div class="avatar">৳</div></header>
<section class="balance"><span>আপনার মোট ব্যালেন্স</span><strong id="balance">৳0.00</strong><small>বাংলাদেশি টাকা</small></section>
<section class="stats"><div><b id="adsToday">0</b><span>আজকের বিজ্ঞাপন</span></div><div><b id="referrals">0</b><span>রেফারেল</span></div></section>
<section class="panel"><h2>বিজ্ঞাপন দেখে আয়</h2><p>Monetag-এর সার্ভার যাচাই সফল হলে রিওয়ার্ড যোগ হবে।</p>
<button id="monetagBtn">▶ Monetag বিজ্ঞাপন দেখুন</button><button id="adsgramBtn" class="secondary">AdsGram বিজ্ঞাপন</button><small id="status" role="status"></small></section>
<nav><button data-tab="home">🏠 হোম</button><button data-tab="referral">👥 রেফারেল</button><button data-tab="wallet">💳 ওয়ালেট</button></nav>
<section id="extra" class="panel hidden"></section><footer>বিজ্ঞাপনের আয় নেটওয়ার্কের অনুমোদন ও বৈধ ট্রাফিকের ওপর নির্ভরশীল।</footer>
</main><script src="/app.js"></script></body></html>
